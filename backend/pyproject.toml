[project]
name = "esbot-backend"
version = "0.1.0"
description = "ESBot CRM and after-sales service platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "alembic>=1.13,<2.0",
  "httpx>=0.27,<1.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.9,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "openpyxl>=3.1,<4.0",
  "email-validator>=2.2,<3.0",
]
[project.optional-dependencies]
test = ["pytest>=8.0,<9.0", "pytest-cov>=5.0,<6.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
